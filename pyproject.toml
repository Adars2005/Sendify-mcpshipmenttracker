[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sendify-shipment-mcp"
version = "0.1.0"
description = "An MCP server for publicly available DB Schenker/DSV shipment tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "playwright>=1.50,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "uv>=0.7,<1"]

[tool.setuptools]
py-modules = ["models", "tracker", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
